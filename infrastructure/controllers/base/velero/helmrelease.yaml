apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  interval: 30m
  chart:
    spec:
      chart: velero
      version: ">=7.0.0"
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: velero
  values:
    schedules:
      daily-cluster-backup:
        disabled: false
        schedule: "0 2 * * *"    # 2am every day
        useOwnerReferencesInBackup: false
        template:
          ttl: "168h"            # keep backups for 7 days
          # Back up the data inside every pod volume (kopia, client-side encrypted) in the
          # included namespaces, not just the manifests. This is what makes PV data recoverable.
          defaultVolumesToFsBackup: true
          includedNamespaces:
            - flux-system
            - velero
            - linkding
            - obsidian-sync
            - vikunja
            - forgejo
            - docmost
            # monitoring removed: it has no PVCs and FSB would copy Prometheus/Grafana emptyDirs nightly
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.14.4
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins

    configuration:
      snapshotsEnabled: false
      volumeSnapshotLocation: []
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: pi-cluster-backups
          default: true
          config:
            region: minio
            s3ForcePathStyle: "true"
            s3Url: http://192.168.1.37:9010
            publicUrl: http://192.168.1.37:9010

    credentials:
      existingSecret: velero-minio-credentials
      existingSecretKey: cloud

    nodeSelector:
      kubernetes.io/arch: arm64

    deployNodeAgent: true
    nodeAgent:
      tolerations:
        - operator: Exists
