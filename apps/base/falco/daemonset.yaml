---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: falco
  namespace: falco
  labels:
    app.kubernetes.io/name: falco
    app.kubernetes.io/part-of: security
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: falco
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falco
        app.kubernetes.io/part-of: security
      annotations:
        configmap-hash: "placeholder"
    spec:
      serviceAccountName: falco

      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule

      # ── Node selection ──────────────────────────────────────────
      # modern_ebpf needs kernel BTF (/sys/kernel/btf/vmlinux). The
      # Raspberry Pi kernels (+rpt-rpi-v8) are built with
      # CONFIG_DEBUG_INFO_NONE and expose none, and Falco 0.44 removed
      # the legacy eBPF probe. Only the x86_64 node can run it today.
      nodeSelector:
        kubernetes.io/arch: amd64

      # ── Host namespaces ─────────────────────────────────────────
      hostPID: true
      hostNetwork: true
      # With hostNetwork the pod would use the node's resolver, which knows
      # nothing about Services. This keeps cluster DNS so http_output can
      # reach the security dashboard by its Service name.
      dnsPolicy: ClusterFirstWithHostNet

      containers:
        - name: falco
          image: docker.io/falcosecurity/falco:0.45.1
          imagePullPolicy: IfNotPresent

          # ── Entrypoint ──────────────────────────────────────────
          # Rules come from rules_files in falco.yaml. Do not add -r here:
          # a CLI -r replaces that list and drops the bundled ruleset.
          args:
            - /usr/bin/falco
            - -c
            - /etc/falco/config/falco.yaml
          securityContext:
            privileged: true

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # ── Volume mounts ───────────────────────────────────────
          volumeMounts:
            - name: falco-config
              mountPath: /etc/falco/config
              readOnly: true

            - name: dev
              mountPath: /dev
              readOnly: true

            - name: proc
              mountPath: /host/proc
              readOnly: true

            # Must sit under /host: the container plugin prepends HOST_ROOT.
            - name: containerd-sock
              mountPath: /host/run/k3s/containerd/containerd.sock
              readOnly: true

      # ── Volumes ─────────────────────────────────────────────────
      volumes:
        - name: falco-config
          configMap:
            name: falco-config

        - name: dev
          hostPath:
            path: /dev
            type: Directory

        - name: proc
          hostPath:
            path: /proc
            type: Directory

        - name: containerd-sock
          hostPath:
            path: /run/k3s/containerd/containerd.sock
            type: Socket
