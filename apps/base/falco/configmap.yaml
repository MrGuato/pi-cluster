apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-config
  namespace: falco
  labels:
    app.kubernetes.io/name: falco
    app.kubernetes.io/part-of: security
data:
  falco.yaml: |
    # ── Engine ──────────────────────────────────────────────────────
    engine:
      kind: modern_ebpf
      modern_ebpf:
        buf_size_preset: 4

    container_engines:
      docker:
        enabled: false
      cri:
        enabled: true
        sockets:
          - /run/containerd/containerd.sock

    # ── Rules ───────────────────────────────────────────────────────
    rules_files:
      - /etc/falco/falco_rules.yaml
      - /etc/falco/rules.d/falco_rules.local.yaml

    # ── Outputs ─────────────────────────────────────────────────────
    stdout_output:
      enabled: true

    syslog_output:
      enabled: false

    file_output:
      enabled: false

    grpc:
      enabled: false

    metadata_download:
      max_mb: 100
      chunk_wait_us: 1000
      watch_freq_sec: 1

    priority: WARNING

    json_output: true
    json_include_output_property: true
    json_include_tags_property: true

    buffered_outputs: true

    - rule: Read sensitive file untouched
      append: true
      condition: >-
        and not (
          k8s.ns.name = "kube-system"
          and proc.name in (k3s-server, k3s-agent, k3s)
        )

    - rule: Launch Suspicious Network Tool in Container
      append: true
      condition: >-
        and not (
          k8s.ns.name = "flux-system"
          and container.image.repository contains "fluxcd"
        )

    - rule: Terminal shell in container
      append: true
      condition: >-
        and not (
          k8s.ns.name = "renovate"
          and container.image.repository contains "renovate"
        )

    # ================================================================
    # HOMELAB-SPECIFIC DETECTIONS
    # ================================================================
    - rule: Kubectl exec into pod
      desc: >-
        Detect kubectl exec sessions. Useful audit trail for a homelab
        where ad-hoc debugging should still be tracked.
      condition: >-
        spawned_process
        and container
        and proc.name = "runc"
        and proc.args contains "exec"
      output: >-
        kubectl exec detected
        (user=%ka.user.name pod=%k8s.pod.name ns=%k8s.ns.name
         command=%proc.cmdline)
      priority: WARNING
      tags: [audit, exec, homelab]

    - rule: Secret file access in container
      desc: >-
        A process inside a container read a file under
        /var/run/secrets/kubernetes.io. Could be normal service
        account token usage, or could be credential harvesting.
      condition: >-
        open_read
        and container
        and fd.name startswith /var/run/secrets/kubernetes.io
        and not proc.name in (coredns, traefik, k3s)
      output: >-
        Secret file read in container
        (user=%user.name process=%proc.name file=%fd.name
         pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: WARNING
      tags: [secrets, access, homelab]
