---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# resources: (plural). "resource:" is silently ignored and Flux reconciles an
# empty list with no error.
resources:
  - namespace.yaml
  - configmap.yaml
  - daemonset.yaml
  - networkpolicy.yaml
  - podmonitor.yaml
  - grafana-dashboard.yaml
