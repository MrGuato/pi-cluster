---
# /api/events exposes source IPs and command lines, so only Prometheus in the
# monitoring namespace may reach port 9817. k3s enforces NetworkPolicy with its
# embedded kube-router controller unless started with --disable-network-policy.
# Egress stays open for DNS and the alert webhook.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pisentry-ingress
  namespace: pisentry
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pisentry
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9817
