apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: docmost
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: kubethink
      containers:
        - name: postgres
          image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
          ports:
            - containerPort: 5432
          env:
            # Pin the data directory to the mounted volume. The postgres:18 image moved its
            # default to /var/lib/postgresql/18/docker, which would ignore the existing data.
            - name: PGDATA
              value: /var/lib/postgresql/data
            - name: POSTGRES_DB
              value: docmost
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: docmost-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docmost-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
