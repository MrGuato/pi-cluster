apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-dashboard
---
# Read only. Pods give agent discovery (pisentry pod IPs), posture checks
# and the image list for Trivy; nodes give coverage per architecture.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: security-dashboard-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: security-dashboard-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: security-dashboard-reader
subjects:
  - kind: ServiceAccount
    name: security-dashboard
    namespace: security-dashboard
