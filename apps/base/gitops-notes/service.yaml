---
apiVersion: v1
kind: Service
metadata:
  name: gitops-notes
  namespace: gitops-notes
  labels:
    app.kubernetes.io/name: gitops-notes
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: gitops-notes
spec:
  # Only reachable inside the cluster. cloudflared in this namespace is the
  # one client, and the NetworkPolicy enforces that.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gitops-notes
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
