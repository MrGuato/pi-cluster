apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 30m
  chart:
    spec:
      chart: forgejo
      version: "17.1.0"
      sourceRef:
        kind: HelmRepository
        name: forgejo
        namespace: forgejo
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1

    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - kubethink

    resources:
      requests:
        memory: 512Mi
        cpu: 200m
      limits:
        memory: 2Gi
        cpu: 2000m

    persistence:
      enabled: true
      create: true
      mount: true
      claimName: forgejo-data
      size: 50Gi
      accessModes:
        - ReadWriteOnce
      storageClass: longhorn-single

    service:
      http:
        type: ClusterIP
        port: 3000
      ssh:
        type: NodePort
        port: 22
        nodePort: 32022
        externalTrafficPolicy: Local

    ingress:
      enabled: false

    gitea:
      admin:
        existingSecret: forgejo-admin-secret
        passwordMode: initialOnlyNoReset

      additionalConfigFromEnvs:
        - name: FORGEJO__database__PASSWD
          valueFrom:
            secretKeyRef:
              name: forgejo-secrets
              key: postgres-password
        - name: FORGEJO__security__SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: forgejo-secrets
              key: secret-key
        - name: FORGEJO__security__INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: forgejo-secrets
              key: internal-token

      config:
        APP_NAME: "deleontech forge"
        server:
          DOMAIN: git.deleontech.net
          ROOT_URL: https://git.deleontech.net/
          SSH_DOMAIN: 192.168.1.204
          SSH_PORT: 32022
          OFFLINE_MODE: true
        database:
          DB_TYPE: postgres
          HOST: forgejo-postgres.forgejo.svc.cluster.local:5432
          NAME: forgejo
          USER: forgejo
        security:
          INSTALL_LOCK: true
        service:
          DISABLE_REGISTRATION: true
          REQUIRE_SIGNIN_VIEW: false
        session:
          PROVIDER: db
        cache:
          ADAPTER: memory
        queue:
          TYPE: level
        indexer:
          ISSUE_INDEXER_TYPE: bleve
          REPO_INDEXER_ENABLED: true
        log:
          LEVEL: info
